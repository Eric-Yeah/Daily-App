name: Edge Functions veröffentlichen

# Von Hand starten: GitHub → Actions → "Edge Functions veröffentlichen" → Run workflow.
# Braucht das Secret SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions).
# Veröffentlicht wird immer der Stand von main.

on:
  workflow_dispatch:
    inputs:
      function:
        description: Welche Function veröffentlicht werden soll
        type: choice
        default: daily-news
        options:
          - daily-news
          - daily-briefing
          - daily-news-detail
          - daily-topics
          - daily-speech
          - daily-prices
          - alle

permissions:
  contents: read

concurrency:
  group: functions
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # Public project reference, also in the README.
      PROJECT_REF: mhyunfeirajnmbrpdojm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm run check:public

      - name: Functions veröffentlichen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FUNCTION: ${{ inputs.function }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Das Secret SUPABASE_ACCESS_TOKEN fehlt (GitHub → Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if [ "$FUNCTION" = "alle" ]; then
            names="daily-news daily-briefing daily-news-detail daily-topics daily-speech daily-prices"
          else
            names="$FUNCTION"
          fi
          npx --yes supabase@2.121.0 functions deploy $names --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
